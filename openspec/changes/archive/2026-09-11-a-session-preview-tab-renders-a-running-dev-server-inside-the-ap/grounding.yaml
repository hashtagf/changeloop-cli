  "decisions": [
    {
      "id": "side-panel-tab-placement",
      "choice": "Preview lives as a reserved session side-panel tab beside Files Changed rather than a bottom panel next to the terminal or a new top-level tab type.",
      "reason": "The side-panel tab model in packages/app/src/pages/session/helpers.ts and session-side-panel.tsx already provides reserved tab ids, per-session state, split sizing and keyboard behavior, so the preview inherits them without new tab persistence or migration."
    },
    {
      "id": "explicit-target-with-advisory-detection",
      "choice": "The target is user-entered and remembered per project; targets seen in terminal output are only suggestions and never navigate on their own.",
      "reason": "Terminal output is the only live source the app already receives; the persisted terminal buffer in packages/app/src/context/terminal.tsx is written on cleanup, so detection cannot be treated as authoritative or complete."
    },
    {
      "id": "frame-src-allowance-only",
      "choice": "Extend the served UI policy with a frame-src allowance for http and https targets instead of relaxing default-src or dropping the policy.",
      "reason": "packages/opencode/src/server/shared/ui.ts sets default-src 'self' with no frame-src or child-src, so framing a dev server is blocked in serve and web mode while the desktop renderer, which injects no policy, would work; a scheme-bounded frame-src is the smallest change that makes both hosts behave the same."
    },
    {
      "id": "insecure-content-is-a-stated-state",
      "choice": "Plain http targets on non-loopback hosts stay in scope but surface an explicit blocked-insecure-content state with a browser fallback on the desktop renderer.",
      "reason": "The desktop renderer loads from the oc:// scheme registered secure:true in packages/desktop/src/main/windows.ts, so Chromium blocks non-loopback http frames as mixed content; the limit cannot be removed from the app and must be visible instead of a blank pane."
    },
    {
      "id": "preview-url-scope",
      "choice": "The preview accepts any http or https host, not only loopback, and rejects all other schemes.",
      "reason": "The user asked for staging and remote targets as well as local dev servers; scheme rejection keeps file, data and javascript targets out of the frame."
    },
    {
      "id": "preview-refresh",
      "choice": "Reload happens on an explicit control and when the app or Preview tab regains focus, never on a hidden timer or project file watcher.",
      "reason": "Dev servers with HMR already refresh themselves; focus reload covers the restart case without competing with HMR or spending resources while hidden."
    }
  ]
}
