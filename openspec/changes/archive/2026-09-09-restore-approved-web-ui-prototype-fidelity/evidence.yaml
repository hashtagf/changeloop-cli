      "impact": "medium",
      "capabilities": [
        "test"
      ]
    },
    {
      "id": "prototype-session-geometry",
      "requirementKey": "prototype-session-geometry",
      "scenario": "A user opens a new session or draft through Changes at 1440x1000 and 390x844.",
      "impact": "medium",
      "capabilities": [
        "test"
      ]
    },
    {
      "id": "prototype-visual-regression",
      "requirementKey": "prototype-visual-regression",
      "scenario": "The corrected UI is checked before delivery through an embedded local changeloop serve build.",
      "impact": "medium",
      "capabilities": [
        "test"
      ]
