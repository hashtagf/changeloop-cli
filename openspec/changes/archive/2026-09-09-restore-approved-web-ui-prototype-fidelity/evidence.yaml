      "scenario": "The user browses Investigations, a saved note, or active/archived Change details at desktop and 390px widths in either theme.",
      "impact": "medium",
      "capabilities": [
        "test"
      ]
    },
    {
      "id": "prototype-overview-reader",
      "requirementKey": "prototype-overview-reader",
