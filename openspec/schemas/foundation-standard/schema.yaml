name: foundation-standard
version: 1
description: Risk-scaled brownfield change with deterministic evidence

artifacts:
  - id: proposal
    generates: proposal.md
    description: Intent, scope, impact, and non-goals
    template: proposal.md
    instruction: Explain why the change exists and what observable behavior changes.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Delta requirements and scenarios
    template: spec.md
    instruction: Write ADDED, MODIFIED, or REMOVED requirements with observable scenarios.
    requires: [proposal]
  - id: design
    generates: design.md
    description: Load-bearing technical decisions and rollback
    template: design.md
    instruction: Record only decisions needed to implement safely in the existing system.
    requires: [proposal, specs]
  - id: tasks
    generates: tasks.md
    description: Single implementation ledger
    template: tasks.md
    instruction: Create coherent, verifiable implementation work items without lifecycle phases.
    requires: [proposal, specs, design]
  - id: evidence
    generates: evidence.yaml
    description: Stable behavioral claims and required evidence capabilities
    template: evidence.yaml
    instruction: Map every observable scenario to stable claims. Discovery is implicit for test claims.
    requires: [proposal, specs]
  - id: grounding
    generates: grounding.yaml
    description: Locked single-batch decisions, complete read set, and claim-to-production evidence map
    template: grounding.yaml
    instruction: Record discovery and every locked material choice/default before Build.
    requires: [proposal, specs, evidence]
  - id: repositories
    generates: repositories.yaml
    description: Repositories this change may touch, and their write scope
    template: repositories.yaml
    instruction: Select every repository the change writes plus their dependency closure. A single-repository change keeps the default root entry.
    requires: [proposal]
  - id: execution
    generates: execution.yaml
    description: Executable provider, report, service, and readiness wiring
    template: execution.yaml
    instruction: Configure project-owned adapters separately from the behavioral contract.
    requires: [evidence]
  - id: handoffs
    generates: handoffs.yaml
    description: Permission-bound external operations and their activation-safe delivery contract
    template: handoffs.yaml
    instruction: Declare DevOps, SRE, security, or operator work separately from implementation tasks; owner defaults to workflow.handoffDefaultOwner, and an empty operations array means none exists.
    requires: [proposal, tasks, evidence, grounding]

apply:
  # handoffs is required by v3.3 lifecycle state, but remains optional here so
  # an active pre-v3.3 change can still apply without mutating its agreement.
  requires: [tasks, evidence, grounding, execution, repositories]
  tracks: tasks.md
